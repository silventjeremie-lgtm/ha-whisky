name: Tests
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Installer les dépendances de test
        run: pip install -r requirements_test.txt
      - name: Lancer les tests
        run: pytest -q
